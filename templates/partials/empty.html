{% comment %}Reusable empty state. Pass title, body and optionally cta_url/cta_label.{% endcomment %}
<div class="empty">
  <span class="empty__mark" aria-hidden="true">◌</span>
  <h2 class="empty__title">{{ title }}</h2>
  <p class="empty__body muted">{{ body }}</p>
  {% if cta_url %}<a class="btn btn--primary" href="{{ cta_url }}">{{ cta_label }}</a>{% endif %}
</div>
