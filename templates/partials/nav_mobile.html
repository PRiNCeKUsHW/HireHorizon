{% load hh %}
<nav class="tabbar" aria-label="Primary">
  <a class="tabbar__item {% if request.resolver_match.view_name == 'core:home' %}is-active{% endif %}" href="{% url 'core:home' %}">
    {% icon "home" 22 %}<span class="tabbar__label">Home</span>
  </a>
  <a class="tabbar__item {% if request.resolver_match.view_name == 'core:explore' %}is-active{% endif %}" href="{% url 'core:explore' %}">
    {% icon "compass" 22 %}<span class="tabbar__label">Explore</span>
  </a>

  {% if user.is_authenticated %}
    <a class="tabbar__item tabbar__item--cta" href="{% url 'blog:post_create' %}" aria-label="Write a post">
      {% icon "plus" 22 %}
    </a>
    <a class="tabbar__item {% if request.resolver_match.view_name == 'core:search' %}is-active{% endif %}" href="{% url 'core:search' %}">
      {% icon "search" 22 %}<span class="tabbar__label">Search</span>
    </a>
    <a class="tabbar__item {% if request.resolver_match.view_name == 'accounts:profile' and request.resolver_match.kwargs.username == user.username %}is-active{% endif %}" href="{{ user.get_absolute_url }}">
      {% icon "user" 22 %}<span class="tabbar__label">Profile</span>
    </a>
  {% else %}
    <a class="tabbar__item {% if request.resolver_match.view_name == 'core:search' %}is-active{% endif %}" href="{% url 'core:search' %}">
      {% icon "search" 22 %}<span class="tabbar__label">Search</span>
    </a>
    <a class="tabbar__item" href="{% url 'accounts:login' %}">
      {% icon "user" 22 %}<span class="tabbar__label">Log in</span>
    </a>
  {% endif %}
</nav>
