{% extends "base.html" %}
{% block title %}Change password — HireHorizon{% endblock %}
{% block content %}
<div class="pagehead"><h1 class="pagehead__title">Change password</h1></div>
<section class="card">
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="flash flash--error">{{ form.non_field_errors }}</div>{% endif %}
    {% for field in form %}{% include "partials/field.html" %}{% endfor %}
    <button class="btn btn--primary" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
